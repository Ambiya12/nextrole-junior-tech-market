[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nextrole"
version = "0.1.0"
description = "Junior technology job market analytics pipeline for France"
requires-python = ">=3.12,<3.15"
dependencies = [
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[project.scripts]
nextrole = "nextrole.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nextrole = ["taxonomy/*.json", "warehouse/migrations/*.sql"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-config --strict-markers --cov=nextrole --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
markers = [
    "integration: requires an explicitly configured external service",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nextrole"]
