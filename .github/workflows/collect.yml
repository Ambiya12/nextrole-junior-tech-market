name: Collect job postings

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nextrole
          POSTGRES_USER: nextrole
          POSTGRES_PASSWORD: nextrole
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextrole -d nextrole"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXTROLE_DATABASE_URL: postgresql://nextrole:nextrole@127.0.0.1:5432/nextrole
      NEXTROLE_DATA_DIR: data
      NEXTROLE_FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
      NEXTROLE_FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install .
      - name: Explain missing credentials
        if: ${{ env.NEXTROLE_FRANCE_TRAVAIL_CLIENT_ID == '' || env.NEXTROLE_FRANCE_TRAVAIL_CLIENT_SECRET == '' }}
        run: echo "France Travail secrets are not configured; collection is skipped."
      - name: Collect target role searches
        if: ${{ env.NEXTROLE_FRANCE_TRAVAIL_CLIENT_ID != '' && env.NEXTROLE_FRANCE_TRAVAIL_CLIENT_SECRET != '' }}
        run: |
          nextrole collect --keywords "data analyst" --max-results 150
          nextrole collect --keywords "analyste BI" --max-results 150
          nextrole collect --keywords "data engineer" --max-results 150
          nextrole collect --keywords "data scientist" --max-results 150
          nextrole collect --keywords "développeur frontend" --max-results 150
          nextrole collect --keywords "développeur backend" --max-results 150
          nextrole collect --keywords "développeur full stack" --max-results 150
      - name: Upload immutable raw snapshots
        if: ${{ env.NEXTROLE_FRANCE_TRAVAIL_CLIENT_ID != '' && env.NEXTROLE_FRANCE_TRAVAIL_CLIENT_SECRET != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: nextrole-raw-${{ github.run_id }}
          path: data/raw
          if-no-files-found: error
          retention-days: 14
