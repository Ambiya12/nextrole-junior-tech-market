name: Project checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nextrole_test
          POSTGRES_USER: nextrole
          POSTGRES_PASSWORD: nextrole
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextrole -d nextrole_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXTROLE_TEST_DATABASE_URL: postgresql://nextrole:nextrole@127.0.0.1:5432/nextrole_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run quality gate
        run: make check

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build demo image
        run: docker build --tag nextrole-demo:test .

