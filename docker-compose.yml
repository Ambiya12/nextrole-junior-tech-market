services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nextrole
      POSTGRES_USER: nextrole
      POSTGRES_PASSWORD: nextrole
    ports:
      - "5432:5432"
    volumes:
      - nextrole_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextrole -d nextrole"]
      interval: 5s
      timeout: 5s
      retries: 10

  demo:
    build: .
    ports:
      - "8501:8501"
    restart: unless-stopped

  pipeline:
    build: .
    profiles: ["pipeline"]
    user: "0:0"
    environment:
      NEXTROLE_DATABASE_URL: postgresql://nextrole:nextrole@postgres:5432/nextrole
      NEXTROLE_DATA_DIR: /app/data
      NEXTROLE_FRANCE_TRAVAIL_CLIENT_ID: ${NEXTROLE_FRANCE_TRAVAIL_CLIENT_ID:-}
      NEXTROLE_FRANCE_TRAVAIL_CLIENT_SECRET: ${NEXTROLE_FRANCE_TRAVAIL_CLIENT_SECRET:-}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["nextrole"]

volumes:
  nextrole_postgres:

